name: Deploy Discord Dashboard

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '51.210.244.46' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'debian' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '2222' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/debian/apps/discord' }}
      VPS_COMPOSE_PROJECT: ${{ vars.VPS_COMPOSE_PROJECT || 'discord-dashboard' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "::error::Missing VPS_SSH_KEY secret."; exit 1; }

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e

            APP_DIR=${{ env.VPS_APP_DIR }}
            PROJECT=${{ env.VPS_COMPOSE_PROJECT }}
            REPO_URL=https://github.com/${{ github.repository }}.git
            FETCH_URL=https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d .git ]; then
              [ -f backend/.env ] && cp backend/.env /tmp/discord-backend-env || true
              git fetch "$FETCH_URL" main
              git reset --hard FETCH_HEAD
              git clean -fd -e backend/.env
              [ -f /tmp/discord-backend-env ] && mkdir -p backend && cp /tmp/discord-backend-env backend/.env || true
            else
              git init
              git remote add origin "$REPO_URL"
              git fetch "$FETCH_URL" main
              git checkout -B main FETCH_HEAD
            fi

            # Page « site indisponible » (502/503/504) servie par le nginx du VPS pendant les redémarrages
            if [ -d /var/www/azim-discord-errors ]; then install -m 644 frontend/deploy/errors/erreur-serveur.html /var/www/azim-discord-errors/erreur-serveur.html; fi

            # Construit d'abord les images et vérifie la config nginx : en cas d'erreur, l'ancien site reste en ligne
            docker compose -p "$PROJECT" build
            docker run --rm --add-host api:127.0.0.1 "$PROJECT-app" nginx -t

            docker compose -p "$PROJECT" down || true
            docker rm -f discord-dashboard-db discord-dashboard-api discord-dashboard-app 2>/dev/null || true
            # Si le bot est en train de se déployer en même temps, son réseau peut manquer quelques secondes
            for i in $(seq 1 30); do
              docker network inspect azim-bot_default >/dev/null 2>&1 && break
              echo "⏳ Attente du réseau du bot ($i/30)…"
              sleep 5
            done
            docker compose -p "$PROJECT" up -d --build
            docker compose -p "$PROJECT" ps
