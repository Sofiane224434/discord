# Réglages du nginx du VPS (devant le site, /etc/nginx), appliqués à la main : ce fichier sert de référence.
#
# /etc/nginx/nginx.conf, bloc http : ne pas afficher la version de nginx
#     server_tokens off;
#
# /etc/nginx/sites-enabled/discord.azim404.com, bloc server en 443 :
# quand le site ne répond pas (redémarrage, déploiement), page aux couleurs d'Azim au lieu de la page nginx.
# Les erreurs renvoyées par l'API elle-même ne sont pas remplacées (pas de proxy_intercept_errors).
error_page 502 503 504 /erreur-serveur.html;
location = /erreur-serveur.html {
    root /var/www/azim-discord-errors;
    internal;
}
# La page est copiée dans /var/www/azim-discord-errors par le déploiement (.github/workflows).
