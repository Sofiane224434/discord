server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compression des fichiers texte (JS, CSS, JSON, SVG…)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/ld+json image/svg+xml font/woff2;

    location /api/ {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Flux vidéo de l'Activité : transmis au fur et à mesure
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Fichiers cachés (.env, .git…) : jamais servis, pas même la page du site
    location ~ /\.(?!well-known) {
        include /etc/nginx/snippets/security-headers.inc;
        return 404;
    }

    # Traductions : toujours revalidées, sinon le navigateur garde d'anciennes clés
    location /locales/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers versionnés par Vite : cache long
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Polices et images du site : cache d'un mois
    location ~* ^/(fonts/|[^/]+\.(webp|png|ico)$) {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Activité Discord « La Mecque en direct ». Dans Discord, la page est servie par le proxy
    # discordsays.com depuis /activite : ses fichiers (/assets, /fonts) y sont donc aussi demandés.
    # Dans Discord, l'API est demandée sous /activite/api/ (vidéo demandée, flux vidéo)
    location ^~ /activite/api/ {
        include /etc/nginx/snippets/activity-headers.inc;
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /activite/assets/ {
        include /etc/nginx/snippets/activity-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        alias /usr/share/nginx/html/assets/;
    }

    location ^~ /activite/fonts/ {
        include /etc/nginx/snippets/activity-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        alias /usr/share/nginx/html/fonts/;
    }

    location ^~ /activite {
        include /etc/nginx/snippets/activity-headers.inc;
        add_header Cache-Control "no-cache";
        try_files /activite/index.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Language "fr";
        try_files $uri $uri/ /index.html;
    }
}
