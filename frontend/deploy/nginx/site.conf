server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        include /etc/nginx/snippets/security-headers.inc;
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers cachés (.env, .git…) : jamais servis, pas même la page du site
    location ~ /\.(?!well-known) {
        include /etc/nginx/snippets/security-headers.inc;
        return 404;
    }

    # Traductions : toujours revalidées, sinon le navigateur garde d'anciennes clés
    location /locales/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers versionnés par Vite : cache long
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
